<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-label="YUN Coffee Roastery logo">
  <defs>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfeaf1"/>
      <stop offset="35%" stop-color="#cddfe7"/>
      <stop offset="58%" stop-color="#f4d9b7"/>
      <stop offset="100%" stop-color="#d9c7aa"/>
    </linearGradient>
    <linearGradient id="beanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5f4b3d"/>
      <stop offset="100%" stop-color="#2e241f"/>
    </linearGradient>
    <filter id="roughen" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="8"/>
      <feDisplacementMap in="SourceGraphic" scale="0.6"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1c1816" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="700" height="260" fill="#f7f5f1"/>

  <g transform="translate(70 8)" filter="url(#softShadow)">
    <g filter="url(#roughen)">
      <path d="M88 146
               C52 146, 21 128, 18 94
               C15 59, 37 30, 72 22
               C87 5, 113 0, 136 11
               C163 -3, 204 -2, 227 16
               C255 7, 293 21, 306 52
               C332 54, 352 76, 352 101
               C352 130, 329 151, 296 151
               L88 151
               Z"
            fill="url(#cloudGradient)"
            stroke="#1a1a1a"
            stroke-width="4"
            stroke-linejoin="round"/>

      <path d="M52 97 C88 82, 117 84, 149 100" fill="none" stroke="#dfe7ea" stroke-width="10" opacity="0.75"/>
      <path d="M130 93 C170 72, 215 74, 260 96" fill="none" stroke="#dfe7ea" stroke-width="10" opacity="0.7"/>
      <path d="M200 83 C236 67, 299 73, 332 94" fill="none" stroke="#f2d9b7" stroke-width="11" opacity="0.8"/>
      <path d="M81 120 C126 123, 169 123, 216 118" fill="none" stroke="#e9dde0" stroke-width="7" opacity="0.7"/>
      <path d="M182 124 C230 124, 276 117, 319 126" fill="none" stroke="#f6e1c9" stroke-width="7" opacity="0.8"/>

      <g fill="#1a1a1a">
        <ellipse cx="162" cy="90" rx="7" ry="8"/>
        <ellipse cx="248" cy="90" rx="7" ry="8"/>
      </g>

      <path d="M168 108 Q 206 127 246 108" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g transform="translate(0 0)">
      <g transform="translate(80 165) rotate(-8)">
        <ellipse cx="0" cy="0" rx="21" ry="13" fill="url(#beanGradient)"/>
        <ellipse cx="0" cy="0" rx="21" ry="13" fill="none" stroke="#1a1a1a" stroke-width="1.5" opacity="0.45"/>
        <path d="M-11 1 C-4 -4, 4 -4, 12 1" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g transform="translate(214 170) rotate(10)">
        <ellipse cx="0" cy="0" rx="21" ry="13" fill="url(#beanGradient)"/>
        <ellipse cx="0" cy="0" rx="21" ry="13" fill="none" stroke="#1a1a1a" stroke-width="1.5" opacity="0.45"/>
        <path d="M-11 1 C-4 -4, 4 -4, 12 1" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <g transform="translate(0 215)">
    <text x="350" y="0"
          text-anchor="middle"
          fill="#1a1a1a"
          font-family="Arial, Helvetica, sans-serif"
          font-size="27"
          font-weight="700"
          letter-spacing="3">
      YUN COFFEE ROASTERY
    </text>
  </g>
</svg>
